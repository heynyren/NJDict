name: Dọn kho bản build

# Vì sao có file này
# ------------------
# Tài khoản GitHub miễn phí được 0,5 GB kho chứa bản build, và quota đó tính
# CHUNG cho mọi repo của tài khoản — nên bản build cũ nằm lại ở đây vẫn ăn mất
# chỗ của những repo đang dùng.
#
# NJDict đã được gộp vào NeutronDict, không còn phát hành bản mới nữa, nên mặc
# định ở đây là KHÔNG giữ lại bản nào (giu_lai = 0). Cần giữ thì vào tab Actions
# bấm "Run workflow" rồi điền số khác.
#
# Bản build đính trong Releases KHÔNG bị đụng tới: chúng nằm ở kho khác, không
# tính vào 0,5 GB này.

on:
  workflow_dispatch:
    inputs:
      giu_lai:
        description: "Giữ lại mấy bản mới nhất của mỗi loại (0 = xoá sạch)"
        required: false
        default: "0"
  schedule:
    - cron: "0 18 * * *"

permissions:
  actions: write

concurrency:
  group: don-kho
  cancel-in-progress: false

jobs:
  don:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@v7
        env:
          GIU_LAI: ${{ github.event.inputs.giu_lai || '0' }}
        with:
          script: |
            const giuLai = Number(process.env.GIU_LAI ?? '0');

            // Lấy hết bản build của repo, kể cả trang sau.
            const tatCa = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 },
            );
            const con = tatCa.filter((a) => !a.expired);

            const MB = (b) => (b / 1024 / 1024).toFixed(1);
            const tong = con.reduce((s, a) => s + a.size_in_bytes, 0);
            core.info(`Đang có ${con.length} bản build, tổng ${MB(tong)} MB.`);

            // Nhóm theo tên rồi bỏ mấy bản mới nhất của từng nhóm.
            const theoTen = new Map();
            for (const a of con) {
              if (!theoTen.has(a.name)) theoTen.set(a.name, []);
              theoTen.get(a.name).push(a);
            }

            const xoa = [];
            for (const [ten, ds] of theoTen) {
              ds.sort((x, y) => new Date(y.created_at) - new Date(x.created_at));
              core.info(`  ${ten}: ${ds.length} bản, giữ ${Math.min(giuLai, ds.length)}`);
              xoa.push(...ds.slice(giuLai));
            }

            let daXoa = 0;
            let thu = 0;
            for (const a of xoa) {
              try {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: a.id,
                });
                daXoa += 1;
                thu += a.size_in_bytes;
              } catch (loi) {
                // Bản build vừa hết hạn ngay lúc này thì trả 404 — không phải lỗi.
                core.warning(`Không xoá được ${a.name} #${a.id}: ${loi.message}`);
              }
            }

            core.info(`Đã xoá ${daXoa} bản, thu lại ${MB(thu)} MB.`);
            await core.summary
              .addHeading('Dọn kho bản build')
              .addTable([
                [{ data: 'Mục', header: true }, { data: 'Số liệu', header: true }],
                ['Trước khi dọn', `${con.length} bản · ${MB(tong)} MB`],
                ['Đã xoá', `${daXoa} bản · ${MB(thu)} MB`],
                ['Còn lại', `${con.length - daXoa} bản · ${MB(tong - thu)} MB`],
              ])
              .write();
